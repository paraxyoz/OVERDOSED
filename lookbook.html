    <script>
        const images = [
            { src: 'images/lookbook/photo_2025-03-11_14-56-39.jpg', alt: 'Look 1' },
            { src: 'images/lookbook/photo_2025-03-13_20-46-18.jpg', alt: 'Look 2' },
            { src: 'images/lookbook/photo_2025-03-14_20-02-21.jpg', alt: 'Look 3' },
            { src: 'images/lookbook/photo_2025-03-23_23-32-39.jpg', alt: 'Look 5' },
            { src: 'images/lookbook/photo_2025-05-08_22-55-17.jpg', alt: 'Look 6' },
            { src: 'images/lookbook/photo_2025-05-08_22-55-18.jpg', alt: 'Look 7' },
            { src: 'images/lookbook/photo_2025-05-08_22-55-27.jpg', alt: 'Look 9' },
            { src: 'images/lookbook/photo_2025-05-08_22-55-28.jpg', alt: 'Look 10' },
            { src: 'images/lookbook/photo_2025-06-08_23-54-16 (2).jpg', alt: 'Look 11' }
        ];

        let currentIndex = 0;
        let autoPlayInterval;

        const mainImage = document.getElementById('mainImage');
        const counter = document.getElementById('carouselCounter');
        const thumbsContainer = document.getElementById('carouselThumbs');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function buildThumbs() {
            thumbsContainer.innerHTML = '';
            images.forEach((img, i) => {
                const div = document.createElement('div');
                div.className = 'thumb-item' + (i === 0 ? ' active' : '');
                div.dataset.index = i;
                const thumbImg = document.createElement('img');
                thumbImg.src = img.src;
                thumbImg.alt = img.alt;
                thumbImg.loading = 'lazy';
                div.appendChild(thumbImg);
                div.addEventListener('click', function() {
                    updateCarousel(parseInt(this.dataset.index));
                    resetAutoPlay();
                });
                thumbsContainer.appendChild(div);
            });
        }

        function updateCarousel(index) {
            if (images.length === 0) return;
            if (index < 0) index = images.length - 1;
            if (index >= images.length) index = 0;
            currentIndex = index;

            mainImage.classList.remove('visible');
            setTimeout(() => {
                mainImage.src = images[currentIndex].src;
                mainImage.alt = images[currentIndex].alt;
                mainImage.classList.add('visible');
            }, 200);

            counter.textContent = `${currentIndex + 1} / ${images.length}`;

            document.querySelectorAll('.thumb-item').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === currentIndex);
            });
        }

        function nextSlide() {
            updateCarousel(currentIndex + 1);
            resetAutoPlay();
        }

        function prevSlide() {
            updateCarousel(currentIndex - 1);
            resetAutoPlay();
        }

        function resetAutoPlay() {
            clearInterval(autoPlayInterval);
            if (images.length > 1) {
                autoPlayInterval = setInterval(nextSlide, 10000);
            }
        }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        buildThumbs();
        updateCarousel(0);
        resetAutoPlay();
    </script>
